# This workflow will build and push a .NET Core app to an Azure Web App when a commit is pushed to the master branch.
#
# This workflow assumes you have already created the target Azure App Service web app.
# For instructions see https://docs.microsoft.com/en-us/azure/app-service/quickstart-dotnetcore?tabs=net60&pivots=development-environment-vscode
#
# To configure this workflow:
#
# 1. Download the Publish Profile for your Azure Web App. You can download this file from the Overview page of your Web App in the Azure Portal.
#    For more information: https://docs.microsoft.com/en-us/azure/app-service/deploy-github-actions?tabs=applevel#generate-deployment-credentials
#
# 2. Create a secret in your repository named AZURE_WEBAPP_PUBLISH_PROFILE, paste the publish profile contents as the value of the secret.
#    For instructions on obtaining the publish profile see: https://docs.microsoft.com/azure/app-service/deploy-github-actions#configure-the-github-secret
#
# 3. Change the value for the AZURE_WEBAPP_NAME. Optionally, change the AZURE_WEBAPP_PACKAGE_PATH and DOTNET_VERSION environment variables below.
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions
# For more information on the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples

name: Build and deploy ASP.Net Core app to an Azure Web App

env:
  AZURE_WEBAPP_NAME: RFC-Website      # set this to the name of your Azure Web App
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # set this to the path to your web app project, defaults to the repository root

on:
  push:
    branches: ["master"]  # Only trigger on push to master branch
  workflow_dispatch:

# Serialize production builds too, so a slower old build cannot replace a newer release.
# Finish the active run; newly arriving runs replace the pending run.
concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'azure-rfc-website-production' || format('azure-rfc-website-nonproduction-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build with Coverage
    uses: ./.github/workflows/build-and-test.yml
    with:
      run-coverage: true
      create-artifact: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: .net-app

      - name: Download smoke executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-smoke
          # The deployment package is the workspace; download tools outside it.
          path: ${{ runner.temp }}/production-smoke

      - name: Set up .NET for smoke verification
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      # A newer commit can arrive during this run, and old runs can be retried.
      - name: Check deployment is still current
        id: deployment-current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$GITHUB_SHA" = "$latest_sha" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping superseded deployment: $GITHUB_SHA is no longer the master head ($latest_sha)."
            echo "Deployment skipped: commit \`$GITHUB_SHA\` has been superseded by master head \`$latest_sha\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        if: steps.deployment-current.outputs.deploy == 'true'
        uses: azure/webapps-deploy@5cfb776471c748b351e1ebf5770e208a54ace016 # v2.2.19
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Verify production deployment
        id: production-smoke
        if: steps.deploy-to-webapp.outcome == 'success'
        timeout-minutes: 5
        shell: bash
        run: |
          dotnet "$RUNNER_TEMP/production-smoke/RedFolder.Smoke.dll" "https://www.red-folder.com" "$GITHUB_SHA" 15
          echo "Production smoke checks passed for commit \`$GITHUB_SHA\` at https://www.red-folder.com." >> "$GITHUB_STEP_SUMMARY"

      - name: Report production verification failure
        if: failure() && steps.production-smoke.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Production deployment verification failed. Review the smoke check diagnostics; no automatic rollback was performed."
          echo "Production was deployed, but smoke verification failed for commit \`$GITHUB_SHA\`. Review the smoke check diagnostics and investigate production. No automatic rollback was performed." >> "$GITHUB_STEP_SUMMARY"

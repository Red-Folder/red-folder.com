# PR Validation Workflow
# This workflow runs on pull requests to ensure code quality before merging

name: PR Validation

on:
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR
    uses: ./.github/workflows/build-and-test.yml
    with:
      run-coverage: false
      create-artifact: false
